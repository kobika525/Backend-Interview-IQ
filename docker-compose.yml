services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: interview_iq
      MYSQL_USER: interviewiq
      MYSQL_PASSWORD: interviewiq_password
      MYSQL_ROOT_PASSWORD: root_password
    ports: ["3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://interviewiq:interviewiq_password@db:3306/interview_iq
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads]
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  mysql_data:
  uploads:
